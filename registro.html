<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | COPACI</title>

    <link rel="stylesheet" href="style.css">

    <script src="registro.js" defer></script>

</head>

<body class="login-body">

    <div class="login-box">

        <h1>COPACI</h1>

        <h2>Crear cuenta ciudadana</h2>

        <p>Registra tus datos para utilizar el sistema.</p>

        <form id="registroForm">

            <label>Nombre completo</label>
            <input type="text" id="nombre" required>

            <label>Dirección o calle</label>
            <input type="text" id="direccion" required>

            <label>Usuario</label>
            <input type="text" id="usuario" required>

            <label>Correo electrónico</label>
            <input type="email" id="correo" required>

            <label>Contraseña</label>
            <input type="password" id="password" required>

            <label>Confirmar contraseña</label>
            <input type="password" id="confirmar" required>

            <button type="submit">Crear cuenta</button>

        </form>

        <p id="mensaje"></p>

        <div class="login-register">

            <p>¿Ya tienes una cuenta?</p>

            <a href="index.html">Regresar al inicio de sesión</a>

        </div>

    </div>

</body>
</html>
