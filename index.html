<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión | COPACI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-box">

        <h1>COPACI</h1>

        <h2>Sistema de Gestión Ciudadana</h2>

        <p>Nicolás Romero, Estado de México</p>

        <!-- INICIO DE SESIÓN -->

        <form id="loginForm">

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario"
                placeholder="Ingresa tu usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password"
                placeholder="Ingresa tu contraseña" required>

            <label for="tipo">Tipo de usuario</label>

            <select id="tipo" required>
                <option value="">Selecciona una opción</option>
                <option value="ciudadano">Ciudadano</option>
                <option value="copaci">Miembro del COPACI</option>
                <option value="admin">Administrador</option>
            </select>

            <button type="submit">Iniciar sesión</button>

        </form>

        <p id="mensaje"></p>

        <!-- CREAR CUENTA -->

        <div id="opcionRegistro">

            <p>¿No tienes una cuenta?</p>

            <a href="registro.html" class="boton">
                Crear cuenta
            </a>

        </div>

    </div>

    <script>

        // OBTENER CIUDADANOS

        function obtenerCiudadanos() {

            const datos = localStorage.getItem("ciudadanos");

            if (!datos) {
                return [];
            }

            try {
                const ciudadanos = JSON.parse(datos);

                return Array.isArray(ciudadanos)
                    ? ciudadanos
                    : [];

            } catch (error) {
                return [];
            }

        }


        // INICIO DE SESIÓN

        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const usuario = document.getElementById("usuario")
                .value.trim().toLowerCase();

            const password = document.getElementById("password").value;

            const tipo = document.getElementById("tipo").value;

            const mensaje = document.getElementById("mensaje");

            mensaje.textContent = "";


            // ADMINISTRADOR

            if (
                tipo === "admin" &&
                usuario === "admin" &&
                password === "Admin2026"
            ) {

                localStorage.setItem("tipoUsuario", "admin");
                localStorage.setItem("usuarioActual", "admin");

                window.location.href = "admin.html";
                return;

            }


            // MIEMBRO DEL COPACI

            if (
                tipo === "copaci" &&
                usuario === "copaci" &&
                password === "COPACI2026"
            ) {

                localStorage.setItem("tipoUsuario", "copaci");
                localStorage.setItem("usuarioActual", "copaci");

                window.location.href = "copaci.html";
                return;

            }


            // CIUDADANO

            if (tipo === "ciudadano") {

                const ciudadanos = obtenerCiudadanos();

                const ciudadano = ciudadanos.find(function(persona) {

                    if (
                        !persona ||
                        !persona.usuario ||
                        persona.password === undefined
                    ) {
                        return false;
                    }

                    return (
                        String(persona.usuario).trim().toLowerCase() === usuario &&
                        String(persona.password) === password
                    );

                });


                if (ciudadano) {

                    localStorage.setItem("tipoUsuario", "ciudadano");

                    localStorage.setItem(
                        "usuarioActual",
                        ciudadano.usuario
                    );

                    localStorage.setItem(
                        "ciudadanoActual",
                        JSON.stringify(ciudadano)
                    );

                    window.location.href = "ciudadano.html";
                    return;

                }

            }


            // ERROR DE ACCESO

            mensaje.textContent =
                "Usuario, contraseña o tipo de usuario incorrectos.";

            mensaje.className = "error";

        });

    </script>

</body>
</html>
