<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión | COPACI</title>

    <link rel="stylesheet" href="style.css">

    <script src="autenticacion.js" defer></script>
</head>

<body class="login-body">

    <div class="login-box">

        <h1>COPACI</h1>

        <h2>Sistema de Gestión Ciudadana</h2>

        <p>Nicolás Romero, Estado de México</p>

        <!-- INICIO DE SESIÓN -->

        <form id="loginForm">

            <label for="usuario">Usuario</label>

            <input
                type="text"
                id="usuario"
                placeholder="Ingresa tu usuario"
                required
            >

            <label for="password">Contraseña</label>

            <input
                type="password"
                id="password"
                placeholder="Ingresa tu contraseña"
                required
            >

            <label for="tipo">Tipo de usuario</label>

            <select id="tipo" required>

                <option value="">Selecciona una opción</option>
                <option value="ciudadano">Ciudadano</option>
                <option value="copaci">Miembro del COPACI</option>
                <option value="admin">Administrador</option>

            </select>

            <button type="submit">Iniciar sesión</button>

        </form>

        <p id="mensaje"></p>

        <!-- CREAR CUENTA -->

        <div id="opcionRegistro">

            <p>¿No tienes una cuenta?</p>

            <a href="registro.html" class="boton">
                Crear cuenta
            </a>

        </div>

    </div>

</body>
</html>
