<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear reporte | COPACI</title>

    <link rel="stylesheet" href="style.css">
    <script src="apartadoC.js" defer></script>
</head>

<body>

<header>

    <h1>COPACI Nicolás Romero</h1>

    <nav>
        <a href="ciudadano.html">Inicio</a>
        <a href="reporte.html">Crear reporte</a>
        <a href="mis-reportes.html">Mis reportes</a>
        <a href="avisos-ciudadano.html">Avisos</a>
        <a href="index.html">Cerrar sesión</a>
    </nav>

</header>

<main class="contenido">

    <section class="bienvenida">

        <h2>Crear reporte</h2>

        <p>
            Describe el problema que deseas reportar
            al COPACI.
        </p>

    </section>

    <section class="tarjeta">

        <form id="reporteForm">

            <label for="asunto">Asunto del reporte:</label>

            <input
                type="text"
                id="asunto"
                placeholder="Ejemplo: Lámpara sin funcionar o bache"
                required
            >

            <label for="descripcion">Descripción:</label>

            <textarea
                id="descripcion"
                rows="5"
                placeholder="Describe el problema..."
                required
            ></textarea>

            <label for="ubicacion">Ubicación:</label>

            <input
                type="text"
                id="ubicacion"
                placeholder="Calle, colonia o lugar donde ocurre"
                required
            >

            <button type="submit" class="boton">
                Enviar reporte
            </button>

        </form>

    </section>

</main>

</body>
</html>
